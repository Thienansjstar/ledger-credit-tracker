name: Card news digest

# This is the working daily digest. A Claude Routine using web search was
# tried instead — it reaches offers these six feeds never carry — but the
# sessions it fires get no repository access, so two test runs wrote nothing.
# The Routine is disabled rather than deleted; if that access is granted,
# remove this schedule before re-enabling it. Two writers on one file would
# overwrite each other every day.
on:
  # 14:00 UTC — morning in US Pacific. GitHub delays cron under load, so
  # treat the time as approximate.
  schedule:
    - cron: '0 14 * * *'
  # Manual runs default to NOT committing, so the feed can be inspected
  # without touching the repo.
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit digest.json back to the repo'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Logs one line per feed: how many items it returned and how many matched.
      # That is what tells us which feed URLs are actually correct.
      - name: Build digest
        run: node scripts/build-digest.mjs

      - name: Show digest.json
        run: cat digest.json

      # The schedule clause is kept in the condition so restoring the cron is a
      # one-line change: a schedule event carries no inputs, so testing
      # `inputs.commit` alone would mean a scheduled run never commits — green
      # workflow, site never updates.
      - name: Commit if asked
        if: ${{ github.event_name == 'schedule' || inputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- digest.json; then
            echo "digest.json unchanged — nothing to commit"
            exit 0
          fi
          git add digest.json
          git commit -m "Update card news digest"
          git push
